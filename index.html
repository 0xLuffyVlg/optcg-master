    <!-- Auto Cache Buster & SW Reset -->
    <script>
      (function() {
        const CURRENT_VERSION = '20261008-embedded-filter-pwa-v1';
        try {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) {
                if (!k.includes(CURRENT_VERSION)) {
                  console.log('[CacheBuster] Purging old cache:', k);
                  caches.delete(k);
                }
              });
            });
          }
          const stored = localStorage.getItem('optcg_bundle_version');
          if (stored !== CURRENT_VERSION) {
            localStorage.setItem('optcg_bundle_version', CURRENT_VERSION);
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (let r of regs) {
                  r.unregister();
                }
              });
            }
          }
        } catch(e) {}
      })();
    </script>
