name: Daily Cardmarket Prices Sync

on:
  schedule:
    # Tous les matins à 04:00 UTC (06:00 heure de Paris)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Daily Price Sync
        run: npm run sync:prices

      - name: Commit and Push Updated Prices
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/price_sync_meta.json src/data/optcg_complete_database.json src/data/card_links.json src/data/variants.json src/data/cards.json src/data/cardmarket_prices.json public/data/details/
          if git diff --quiet && git diff --staged --quiet; then
            echo "Aucune modification de prix détectée."
          else
            git commit -m "chore: auto-sync daily Cardmarket Near Mint prices [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
