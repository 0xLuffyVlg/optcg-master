name: Daily Tournaments Sync

on:
  schedule:
    # Tous les matins à 05:00 UTC (07:00 heure de Paris) - Décalé après Cardmarket
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write

jobs:
  sync-tournaments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Daily Tournaments Sync
        run: npm run sync:tournaments

      - name: Commit and Push Updated Tournaments
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tournaments.json public/data/tournaments.json src/data/tournaments_initial.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No tournament changes detected."
          else
            git commit -m "chore: auto-sync daily competitive tournaments [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
