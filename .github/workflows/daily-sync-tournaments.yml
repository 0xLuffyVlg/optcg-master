name: Daily Tournaments Sync

on:
  schedule:
    # Tous les matins à 05:15 UTC (06:15 en hiver / 07:15 en été, heure de Paris)
    - cron: '15 5 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write

jobs:
  sync-tournaments:
    name: Sync Daily Competitive Tournaments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Daily Tournaments Sync
        run: npm run sync:tournaments

      - name: Commit and Push Updated Tournaments
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tournaments.json public/data/tournaments.json src/data/tournaments_initial.json
          if git diff --staged --quiet; then
            echo "No tournament changes detected."
          else
            git commit -m "chore: auto-sync daily competitive tournaments"
            pushed=0
            for attempt in 1 2 3; do
              echo "Tentative de push $attempt/3..."
              if git push origin main; then
                echo "✓ Push réussi vers origin main !"
                pushed=1
                break
              fi
              echo "⚠ Push rejeté (origin/main a avancé). Rebase automatique avec priorité aux données fraîches..."
              git fetch origin main
              if ! git pull --rebase -X theirs origin main; then
                echo "⚠ Conflit résolu en faveur des données fraîches..."
                git checkout --theirs src/data/ public/data/ 2>/dev/null || true
                git add -A
                git -c core.editor=true rebase --continue || git rebase --abort || true
              fi
              sleep 2
            done
            if [ $pushed -eq 0 ]; then
              echo "Échec du push après 3 tentatives"
              exit 1
            fi
          fi
